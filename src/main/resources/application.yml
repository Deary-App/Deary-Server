spring:
  application:
    name: deary-server
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

jwt:
  issuer: deary-server
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:30m}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}

oauth:
  apple:
    issuer: https://appleid.apple.com
    jwk-set-uri: https://appleid.apple.com/auth/keys
    client-ids: ${APPLE_CLIENT_IDS:}
    token-uri: https://appleid.apple.com/auth/token
    revoke-uri: https://appleid.apple.com/auth/revoke
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}
  google:
    issuers: https://accounts.google.com,accounts.google.com
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
    client-ids: ${GOOGLE_CLIENT_IDS:}

storage:
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    profile-bucket: ${SUPABASE_PROFILE_BUCKET:avatars}
    diary-bucket: ${SUPABASE_DIARY_BUCKET:diary-images}
    download-url-expiration: ${SUPABASE_DOWNLOAD_URL_EXPIRATION:1h}

correction:
  claim-duration: ${CORRECTION_CLAIM_DURATION:30m}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
