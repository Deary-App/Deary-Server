spring:
  application:
    name: deary-server
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

jwt:
  issuer: deary-server
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:30m}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}

oauth:
  apple:
    issuer: https://appleid.apple.com
    jwk-set-uri: https://appleid.apple.com/auth/keys
    client-ids: ${APPLE_CLIENT_IDS:}
    token-uri: https://appleid.apple.com/auth/token
    revoke-uri: https://appleid.apple.com/auth/revoke
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}
  google:
    issuers: https://accounts.google.com,accounts.google.com
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
    client-ids: ${GOOGLE_CLIENT_IDS:}

storage:
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    profile-bucket: ${SUPABASE_PROFILE_BUCKET:avatars}
    diary-bucket: ${SUPABASE_DIARY_BUCKET:diary-images}
    download-url-expiration: ${SUPABASE_DOWNLOAD_URL_EXPIRATION:1h}

correction:
  claim-duration: ${CORRECTION_CLAIM_DURATION:30m}

report:
  notification:
    webhook-url: ${REPORT_WEBHOOK_URL:}
    admin-url: ${REPORT_ADMIN_URL:}

admin:
  api-key: ${ADMIN_API_KEY:}

moderation:
  openai:
    base-url: https://api.openai.com/v1
    api-key: ${OPENAI_API_KEY:}
    model: ${MODERATION_MODEL:omni-moderation-latest}
    # 이 분류에 걸리면 자동으로 숨긴다. violence·self-harm·illicit처럼 일상 글에서도 잘 걸리는 분류는 넣지 않는다
    hide-categories: ${MODERATION_HIDE_CATEGORIES:sexual,sexual/minors,harassment,harassment/threatening,hate,hate/threatening,violence/graphic,self-harm/instructions,illicit/violent}
    # 선정성 점수(0~1)가 이 값 이상이면 OpenAI가 걸지 않았어도 숨긴다. 낮출수록 엄격하다
    sexual-score-threshold: ${MODERATION_SEXUAL_THRESHOLD:0.3}

push:
  expo:
    enabled: ${PUSH_ENABLED:true}
    access-token: ${EXPO_ACCESS_TOKEN:}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: false
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  in-app-includes: com.deary.server
  context-tags: traceId
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info
