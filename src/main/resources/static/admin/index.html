<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Deary 신고함</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --text: #1f1e1c; --muted: #6b6a66; --line: #e3e1db;
  --accent: #2f6fde; --accent-bg: #e7effc; --danger: #c43c3c; --danger-bg: #fbeaea;
  --warn: #9a6200; --warn-bg: #fcf1dc; --ok: #2e7d4f; --ok-bg: #e5f4ea;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --card: #20201f; --text: #ecebe7; --muted: #a09f9a; --line: #353532;
    --accent: #7aa7f0; --accent-bg: #1d2b44; --danger: #f08b8b; --danger-bg: #3d2020;
    --warn: #f0c26e; --warn-bg: #3b2e14; --ok: #7fd3a0; --ok-bg: #19352a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; flex: 1; }
button { font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 10px 14px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
button.ghost { border: none; background: none; padding: 6px 8px; color: var(--muted); }
button:disabled { opacity: .5; }
input, textarea { font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
textarea { min-height: 64px; resize: vertical; }
.tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; }
.tabs button { padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.tabs button.on { background: var(--accent-bg); color: var(--accent); border-color: transparent; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; width: 100%; text-align: left; }
.row .main { flex: 1; min-width: 0; }
.row .title { font-weight: 600; }
.sub { color: var(--muted); font-size: 13px; }
.badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-bg); color: var(--accent); }
.badge.danger { background: var(--danger-bg); color: var(--danger); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.kv { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-all; }
.content { white-space: pre-wrap; word-break: break-word; }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; }
.photo { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--line); border: none; padding: 0; }
.photo img { width: 100%; height: 100%; object-fit: cover; filter: blur(18px); transform: scale(1.1); }
.photo.shown img { filter: none; transform: none; }
.photo span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; text-shadow: 0 1px 2px #000; }
.photo.shown span { display: none; }
.avatar { width: 56px; height: 56px; border-radius: 50%; }
.avatar img { border-radius: 50%; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.actions .wide { grid-column: 1 / -1; }
.item { border-top: 1px solid var(--line); padding: 8px 0; font-size: 14px; }
.item del { color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.error { color: var(--danger); font-size: 14px; margin: 8px 0; }
section h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
(() => {
  const KEY_STORAGE = 'deary-admin-key';
  const API = '/api/v1/admin';
  const STATUSES = [
    ['PENDING', '대기'], ['HIDDEN', '숨김'], ['SUSPENDED', '정지'], ['DISMISSED', '문제없음']
  ];
  const STATUS_LABEL = Object.fromEntries(STATUSES);
  const STATUS_BADGE = { PENDING: 'danger', HIDDEN: 'warn', SUSPENDED: 'warn', DISMISSED: 'ok' };
  const TARGET_LABEL = { DIARY: '일기', CORRECTION: '교정', USER: '사용자' };
  const REASON_LABEL = { SPAM: '스팸', ABUSE: '욕설·괴롭힘', SEXUAL: '성적 콘텐츠', PERSONAL_INFO: '개인정보 노출', OTHER: '기타' };
  const app = document.getElementById('app');
  let currentStatus = 'PENDING';

  const store = {
    get() { try { return localStorage.getItem(KEY_STORAGE) || ''; } catch { return ''; } },
    set(value) { try { localStorage.setItem(KEY_STORAGE, value); } catch { /* 저장 불가: 이번 접속에만 사용 */ } memoryKey = value; },
    clear() { try { localStorage.removeItem(KEY_STORAGE); } catch { } memoryKey = ''; }
  };
  let memoryKey = store.get();

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [name, value] of Object.entries(attrs)) {
      if (value == null || value === false) continue;
      if (name.startsWith('on')) node.addEventListener(name.slice(2), value);
      else if (name === 'class') node.className = value;
      else node.setAttribute(name, value === true ? '' : value);
    }
    for (const child of children.flat()) {
      if (child == null || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }

  function formatTime(value) {
    if (!value) return '';
    return new Date(value).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  async function request(path, options = {}) {
    const response = await fetch(API + path, {
      ...options,
      headers: { 'X-Admin-Key': memoryKey, 'Content-Type': 'application/json', ...(options.headers || {}) }
    });
    const body = await response.json().catch(() => null);
    if (response.status === 401) {
      store.clear();
      renderLogin('키가 맞지 않아요. 다시 입력해 주세요.');
      throw new Error('unauthorized');
    }
    if (!response.ok) throw new Error(body?.message || '요청에 실패했어요.');
    return body.data;
  }

  function renderLogin(message) {
    const input = el('input', { type: 'password', placeholder: '운영자 키', autocomplete: 'current-password' });
    const form = el('form', { onsubmit: event => {
      event.preventDefault();
      if (!input.value.trim()) { input.focus(); return; }
      store.set(input.value.trim());
      location.hash = '';
      route();
    } },
      el('div', { class: 'card' },
        el('p', { class: 'sub' }, '처음 한 번만 입력하면 이 브라우저에 저장돼요.'),
        input,
        message && el('p', { class: 'error' }, message),
        el('div', { class: 'actions' }, el('button', { class: 'primary wide', type: 'submit' }, '들어가기'))
      ));
    app.replaceChildren(el('header', {}, el('h1', {}, 'Deary 신고함')), form);
    input.focus();
  }

  async function renderList() {
    const tabs = el('div', { class: 'tabs' }, STATUSES.map(([status, label]) =>
      el('button', { class: status === currentStatus ? 'on' : '', onclick: () => { currentStatus = status; renderList(); } }, label)));
    const list = el('div', {}, el('p', { class: 'empty' }, '불러오는 중…'));
    app.replaceChildren(
      el('header', {},
        el('h1', {}, 'Deary 신고함'),
        el('button', { class: 'ghost', onclick: renderList, 'aria-label': '새로고침' }, '새로고침'),
        el('button', { class: 'ghost', onclick: () => { store.clear(); renderLogin(); } }, '나가기')),
      tabs, list);
    try {
      const data = await request('/reports?status=' + currentStatus);
      if (!data.reports.length) {
        list.replaceChildren(el('p', { class: 'empty' }, currentStatus === 'PENDING' ? '처리할 신고가 없어요.' : '항목이 없어요.'));
        return;
      }
      list.replaceChildren(...data.reports.map(report => el('button', { class: 'row', onclick: () => { location.hash = '#/reports/' + report.reportId; } },
        el('div', { class: 'main' },
          el('div', { class: 'title' }, TARGET_LABEL[report.targetType] + ' #' + report.targetId),
          el('div', { class: 'sub' }, report.reasons.map(reason => REASON_LABEL[reason] || reason).join(', ')
            + ' · 신고 ' + report.reportCount + '건 · ' + formatTime(report.reportedAt))),
        el('span', { class: 'badge ' + STATUS_BADGE[report.status] }, STATUS_LABEL[report.status]))));
    } catch (error) {
      if (error.message !== 'unauthorized') list.replaceChildren(el('p', { class: 'error' }, error.message));
    }
  }

  function photoButton(url, label) {
    const button = el('button', { class: 'photo', type: 'button', onclick: () => button.classList.toggle('shown') },
      el('img', { src: url, alt: '', loading: 'lazy' }), el('span', {}, label || '탭해서 보기'));
    return button;
  }

  function renderTarget(report) {
    if (report.targetType === 'DIARY') {
      const diary = report.diary;
      if (!diary) return el('div', { class: 'card' }, el('p', { class: 'sub' }, '작성자가 이미 삭제한 일기예요.'));
      return el('div', { class: 'card' },
        el('section', {}, el('h2', {}, '일기 · ' + diary.diaryDate + (diary.hidden ? ' · 숨김 중' : ''))),
        diary.photoUrls.length > 0 && el('div', { class: 'photos' }, diary.photoUrls.map(url => photoButton(url))),
        el('div', { class: 'title' }, diary.title),
        el('p', { class: 'content' }, diary.content));
    }
    if (report.targetType === 'CORRECTION') {
      const correction = report.correction;
      if (!correction) return el('div', { class: 'card' }, el('p', { class: 'sub' }, '이미 삭제된 교정이에요.'));
      return el('div', { class: 'card' },
        el('section', {}, el('h2', {}, '교정 · 일기 #' + correction.diaryId + (correction.hidden ? ' · 숨김 중' : ''))),
        el('p', { class: 'content' }, correction.comment),
        correction.items.map(item => el('div', { class: 'item' },
          el('div', {}, el('del', {}, item.originalContent)),
          el('div', {}, item.correctedContent),
          item.reason && el('div', { class: 'sub' }, item.reason))));
    }
    const user = report.targetUser;
    if (!user) return el('div', { class: 'card' }, el('p', { class: 'sub' }, '탈퇴한 사용자예요.'));
    return el('div', { class: 'card' },
      el('section', {}, el('h2', {}, '사용자 프로필' + (user.profileImageHidden ? ' · 사진 내림' : ''))),
      user.profileImageUrl ? el('div', { class: 'photos' }, el('div', { class: 'avatar' }, photoButton(user.profileImageUrl, '보기'))) : el('p', { class: 'sub' }, '프로필 사진 없음'),
      el('div', { class: 'title' }, user.nickname || '(프로필 없음)'));
  }

  async function renderDetail(reportId) {
    app.replaceChildren(el('header', {},
      el('button', { class: 'ghost', onclick: () => { location.hash = ''; } }, '← 목록'),
      el('h1', {}, '신고 #' + reportId)), el('p', { class: 'empty' }, '불러오는 중…'));
    let report;
    try {
      report = await request('/reports/' + reportId);
    } catch (error) {
      if (error.message !== 'unauthorized') app.append(el('p', { class: 'error' }, error.message));
      return;
    }
    const user = report.targetUser;
    const memo = el('textarea', { placeholder: '메모 (선택)' });
    memo.value = report.memo || '';
    const errorBox = el('p', { class: 'error' });
    const act = async (action, confirmMessage) => {
      if (confirmMessage && !confirm(confirmMessage)) return;
      buttons.forEach(button => { button.disabled = true; });
      try {
        await request('/reports/' + reportId, { method: 'PATCH', body: JSON.stringify({ action, memo: memo.value }) });
        location.hash = '';
      } catch (error) {
        if (error.message !== 'unauthorized') errorBox.textContent = error.message;
        buttons.forEach(button => { button.disabled = false; });
      }
    };
    const hideLabel = report.targetType === 'USER' ? '프로필 사진 내리기' : '숨기기';
    const buttons = report.status === 'PENDING'
      ? [
        el('button', { onclick: () => act('DISMISS') }, '문제없음'),
        el('button', { class: 'danger', onclick: () => act('HIDE') }, hideLabel),
        el('button', { class: 'wide', onclick: () => act('SUSPEND', '이 사용자를 정지할까요? 앱을 쓸 수 없게 되고, 글과 교정이 다른 사람에게 보이지 않아요.') }, '작성자 정지')
      ]
      : [el('button', { class: 'wide', onclick: () => act('REOPEN', '처리를 되돌리고 대기로 돌릴까요?') },
        report.status === 'DISMISSED' ? '대기로 되돌리기' : '되돌리기 (' + STATUS_LABEL[report.status] + ' 해제)')];

    app.replaceChildren(
      el('header', {},
        el('button', { class: 'ghost', onclick: () => { location.hash = ''; } }, '← 목록'),
        el('h1', {}, '신고 #' + report.reportId),
        el('span', { class: 'badge ' + STATUS_BADGE[report.status] }, STATUS_LABEL[report.status])),
      renderTarget(report),
      el('div', { class: 'card' },
        el('section', {}, el('h2', {}, '신고 ' + report.reports.length + '건')),
        report.reports.map(entry => el('div', { class: 'item' },
          el('div', {}, REASON_LABEL[entry.reason] || entry.reason, el('span', { class: 'sub' }, ' · ' + formatTime(entry.createdAt))),
          entry.detail && el('div', { class: 'sub content' }, entry.detail)))),
      el('div', { class: 'card' },
        el('dl', { class: 'kv' },
          el('dt', {}, '작성자'), el('dd', {}, user ? (user.nickname || '-') + ' (#' + user.userId + ')' : '탈퇴'),
          el('dt', {}, '누적 신고'), el('dd', {}, user ? user.reportCount + '건' : '-'),
          el('dt', {}, '계정'), el('dd', {}, user ? (user.suspended ? '정지됨' : '정상') : '-'),
          report.handledAt && el('dt', {}, '처리 시각'), report.handledAt && el('dd', {}, formatTime(report.handledAt)))),
      el('div', { class: 'card' }, memo, errorBox, el('div', { class: 'actions' }, buttons)));
  }

  function route() {
    if (!memoryKey) { renderLogin(); return; }
    const match = location.hash.match(/^#\/reports\/(\d+)$/);
    if (match) renderDetail(match[1]);
    else renderList();
  }

  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
