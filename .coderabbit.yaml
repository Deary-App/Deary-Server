language: "ko-KR"

reviews:
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - develop
      - deploy

  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  path_filters:
    - "!**/*.md"
    - "!**/docs/**"
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/out/**"

  path_instructions:
    - path: "src/main/java/**/domain/**/*.java"
      instructions: |
        - Controller, Service, Repository, Entity, DTO의 책임이 서로 섞이지 않았는지 확인해 주세요.
        - 도메인 간 의존성이 과하게 얽히지 않았는지 확인해 주세요.
        - 클래스·메서드·DTO 이름이 docs/conventions/coding-style.md의 규칙을 따르는지 확인해 주세요.

    - path: "src/main/java/**/domain/**/controller/**/*.java"
      instructions: |
        - Controller에 비즈니스 로직이 들어가지 않았는지 확인해 주세요.
        - 요청 DTO 검증(@Valid)이 적절한지 확인해 주세요.
        - URL이 소문자·복수형·하이픈 규칙을 따르고 HTTP 메서드로 드러나는 행위를 반복하지 않는지 확인해 주세요.
        - 인증이 필요한 API에서 인증 사용자 식별이 누락되지 않았는지 확인해 주세요.

    - path: "src/main/java/**/domain/**/service/**/*.java"
      instructions: |
        - 트랜잭션 경계와 readOnly 설정이 적절한지 확인해 주세요.
        - 권한·소유권 검사가 누락되지 않았는지 확인해 주세요.
        - 토큰 지급·차감, 중복 요청, 동시 요청처럼 정합성이 필요한 로직에서 잠금·unique 제약·멱등 처리가 충분한지 확인해 주세요.
        - 예외 처리와 실패 케이스 처리가 충분한지 확인해 주세요.

    - path: "src/main/java/**/domain/**/repository/**/*.java"
      instructions: |
        - Repository가 데이터 접근 책임만 가지는지 확인해 주세요.
        - 쿼리 성능과 N+1 문제가 없는지 확인해 주세요.
        - 사용자별 데이터 조회에 소유권 조건이 빠지지 않았는지 확인해 주세요.

    - path: "src/main/java/**/domain/**/entity/**/*.java"
      instructions: |
        - @Table, @Column 등 매핑 어노테이션이 명시되어 있는지 확인해 주세요.
        - 필드가 기본 키 → 일반 정보 → 연관관계 순서로 작성되어 있는지 확인해 주세요.
        - Setter 남용이나 public 필드 노출이 없는지 확인해 주세요.
        - JPA 연관관계, cascade, fetch 전략이 적절한지 확인해 주세요.

    - path: "src/main/java/**/domain/**/dto/**/*.java"
      instructions: |
        - Entity가 API 응답으로 직접 노출되지 않는지 확인해 주세요.
        - Validation annotation이 필요한 곳에 적용되어 있는지 확인해 주세요.
        - 민감 정보가 응답 DTO에 포함되지 않았는지 확인해 주세요.

    - path: "src/main/java/**/global/**/*.java"
      instructions: |
        - Configuration, Filter, Security 설정의 책임이 명확한지 확인해 주세요.
        - Bean 순환 참조 가능성이 없는지 확인해 주세요.
        - 환경변수, 토큰, 키 등 민감 정보가 코드나 로그에 노출되지 않는지 확인해 주세요.

    - path: "src/main/java/**/*.java"
      instructions: |
        - null 처리, 예외 처리, 트랜잭션 경계가 적절한지 확인해 주세요.
        - 성능 문제나 불필요한 중복 로직이 있는지 확인해 주세요.
        - public 메서드 아래에 private 메서드가 오도록 작성되어 있는지 확인해 주세요.

    - path: "src/main/resources/db/migration/**/*.sql"
      instructions: |
        - 이미 적용된 migration 파일을 수정하지 않고 새 버전 파일로 변경했는지 확인해 주세요.
        - 테이블·컬럼 이름이 snake_case인지 확인해 주세요.
        - 기존 데이터, NULL, 기본값, 인덱스와 잠금 영향을 확인해 주세요.

    - path: "src/main/resources/**/*.yml"
      instructions: |
        - 비밀번호, 키, 토큰 같은 실제 비밀값이 들어가지 않았는지 확인해 주세요.
        - local과 prod 프로필 설정이 서로 맞는지 확인해 주세요.

    - path: "src/test/**/*.java"
      instructions: |
        - 테스트의 목적과 Given-When-Then 구조가 명확한지 확인해 주세요.
        - Mock을 과도하게 사용하지 않았는지 확인해 주세요.
        - DB가 필요한 테스트는 Testcontainers 구성을 따르는지 확인해 주세요.

    - path: ".github/workflows/**/*.yml"
      instructions: |
        - Secret이나 민감 정보가 노출되지 않는지 확인해 주세요.
        - 권한이 최소화되어 있는지 확인해 주세요.
        - 불필요하게 오래 걸리거나 중복 실행되는 Job이 없는지 확인해 주세요.

    - path: "compose.yaml"
      instructions: |
        - 로컬 전용 값 외에 실제 비밀값이 들어가지 않았는지 확인해 주세요.
        - 포트 노출과 볼륨 설정이 적절한지 확인해 주세요.

chat:
  auto_reply: true
